{% extends 'base.html' %}

{% block title %}Forgot Password - Handora{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your registered email below to reset your password</p>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" required autofocus autocomplete="email" placeholder="Enter your registered email">
            </div>

            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
