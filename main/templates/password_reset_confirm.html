{% extends 'base.html' %}

{% block title %}Reset Your Password - Handora{% endblock %}

{% block extra_css %}
<style>
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
        z-index: 2;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a6a5a;
    }

    .password-toggle svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .password-toggle:hover {
        color: #7B2D26;
    }

    .password-wrapper {
        position: relative;
        display: block;
    }

    .password-wrapper .auth-form input[type="text"],
    .password-wrapper .auth-form input[type="password"] {
        width: 100%;
        padding: 13px 40px 13px 16px;
    }
</style>
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <h1 class="auth-title">
            Reset Your Password
        </h1>

        <p class="auth-subtitle">
            Enter your new password below
        </p>

        <form method="post" class="auth-form">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_new_password1">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="new_password1"
                        id="id_new_password1"
                        required
                        autocomplete="new-password"
                        placeholder="Enter new password"
                    >

                    <span
                        class="password-toggle"
                        data-target="id_new_password1"
                        role="button"
                        tabindex="0"
                        aria-label="Toggle password visibility"
                    >
                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        </svg>
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label for="id_new_password2">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="new_password2"
                        id="id_new_password2"
                        required
                        autocomplete="new-password"
                        placeholder="Confirm new password"
                    >

                    <span
                        class="password-toggle"
                        data-target="id_new_password2"
                        role="button"
                        tabindex="0"
                        aria-label="Toggle password visibility"
                    >
                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        </svg>
                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                Reset Password
            </button>

        </form>


        <div class="auth-links">

            <a href="{% url 'login' %}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script>
    document.addEventListener('DOMContentLoaded', function () {

        var toggles = document.querySelectorAll(
            '.password-toggle'
        );

        toggles.forEach(function (toggle) {

            var targetId =
                toggle.getAttribute('data-target');

            var input =
                document.getElementById(targetId);

            function togglePassword() {

                if (input.type === 'password') {

                    input.type = 'text';

                } else {

                    input.type = 'password';

                }
            }

            toggle.addEventListener(
                'click',
                togglePassword
            );

            toggle.addEventListener(
                'keydown',
                function (e) {

                    if (
                        e.key === 'Enter' ||
                        e.key === ' '
                    ) {

                        e.preventDefault();

                        togglePassword();
                    }
                }
            );

        });

    });
</script>

{% endblock %}
