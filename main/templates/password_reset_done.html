{% extends 'base.html' %}

{% block title %}Password Reset Successful - Handora{% endblock %}

{% block extra_css %}
<style>
    .password-reset-login-btn {
        display: inline-block;
        background-color: #7B2D26;
        color: #ffffff !important;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        border: none;
        cursor: pointer;
    }

    .password-reset-login-btn:visited,
    .password-reset-login-btn:hover,
    .password-reset-login-btn:active {
        color: #ffffff !important;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">

        <h1 class="auth-title">
            Password Reset Successful
        </h1>

        <p class="auth-subtitle">
            Your password has been changed successfully.
        </p>

        <div class="auth-links">
            <a href="{% url 'login' %}" class="password-reset-login-btn">
                Login
            </a>
        </div>

    </div>
</div>
{% endblock %}
